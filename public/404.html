<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function redirectToSpa(location) {
        // Already in SPA redirect format — hand off to index.html restore script.
        if (location.search[1] === '/') {
          var indexPath = location.pathname.replace(/\/?$/, '/') + 'index.html';
          location.replace(indexPath + location.search + location.hash);
          return;
        }

        var pathSegments = location.pathname.split('/');
        var repoPathSegments = 0;

        // GitHub project pages live at username.github.io/<repo>/...
        if (location.hostname.endsWith('.github.io')) {
          var repoName = 'MebelLanding';
          if (pathSegments[1] === repoName) {
            repoPathSegments = 1;
          }
        }

        var basePath = pathSegments.slice(0, repoPathSegments + 1).join('/') + '/';
        var routePath = pathSegments.slice(repoPathSegments + 1).join('/');
        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : '';

        location.replace(
          location.protocol + '//' +
          location.hostname +
          (location.port ? ':' + location.port : '') +
          basePath +
          '?' +
          '/' + routePath.replace(/&/g, '~and~') +
          query +
          location.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
